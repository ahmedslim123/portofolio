<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ahmed Slim">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#131a44"/>
      <stop offset="55%"  stop-color="#0b0f2b"/>
      <stop offset="100%" stop-color="#05060f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#00f7ff" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#00f7ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00f7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="35%"  stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#1e9fff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" ry="12" fill="url(#plate)"/>
  <circle cx="32" cy="32" r="28" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#e5c16f" stroke-width="3.4"/>
  <circle cx="32" cy="32" r="17.8" fill="none" stroke="#00f7ff" stroke-width="0.9" opacity="0.45"/>
  <polygon points="32,21.5 42.5,32 32,42.5 21.5,32" fill="url(#gem)"/>
</svg>